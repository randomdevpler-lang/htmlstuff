<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: white; padding: 20px; }
        textarea { width: 100%; height: 250px; background: #2b2b2b; color: #00ff00; border: 1px solid #444; padding: 10px; font-family: monospace; }
        .btn { background: #6200ee; color: white; border: none; padding: 12px 24px; cursor: pointer; border-radius: 4px; margin-top: 10px; font-weight: bold; }
        .instruction { color: #bbb; font-size: 0.9em; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>Reading To Do, i-Ready</h2>
    <textarea id="codeSource" placeholder="Paste your large JavaScript code here..."></textarea>
    
    <button class="btn" onclick="prepareInjection()">Prepare Injection</button>

    <div id="steps" style="display:none;">
        <p class="instruction">1. Your code is copied. Go to the Blooket tab.</p>
        <p class="instruction">2. Click the Address Bar, type <b>javascript:</b> (manually), and then <b>Paste</b>.</p>
        <p class="instruction">3. Enjoy :D</p>
    </div>

    <script>
        function prepareInjection() {
            const rawCode = document.getElementById('codeSource').value;
            
            // Wrap the code in an IIFE to ensure it runs safely as a single block
            const formattedCode = "javascript:(function(){" + encodeURI(rawCode) + "})();";
            
            // Copy to clipboard
            navigator.clipboard.writeText(formattedCode).then(() => {
                document.getElementById('steps').style.display = 'block';
                alert("Injection string copied! Follow the instructions on screen.");
            });
        }
    </script>

</body>
</html>
